<!-- Original paper stock for the driver directory. Export to public/art/dossier-paper.webp with sharp at quality 84. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="432" viewBox="0 0 512 432">
  <defs>
    <filter id="stock" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".013 .024" numOctaves="4" seed="23" result="cloud"/>
      <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 .37  0 0 0 0 .26  0 0 0 0 .12  .52 0 0 0 -.13" result="foxing"/>
      <feTurbulence type="fractalNoise" baseFrequency=".66 .39" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .22  0 0 0 0 .24  0 0 0 0 .17  0 .39 0 0 -.13"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="foxing"/><feMergeNode/></feMerge>
    </filter>
    <filter id="bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".16" numOctaves="2" seed="6"/>
      <feDisplacementMap in="SourceGraphic" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="512" height="432" fill="#f0e7cb" filter="url(#stock)"/>
  <!-- An interrupted glass rim and its dried tide line; no text is baked into the stock. -->
  <g filter="url(#bleed)" fill="none" stroke="#93531d">
    <path opacity=".31" stroke-width="5" d="M498 29c-36 2-57 26-55 54 1 27 21 47 46 51 13 2 26-1 37-9"/>
    <path opacity=".23" stroke-width="1.8" d="M501 25c-35-1-63 24-63 57 0 34 25 54 51 57m-26-94c21-17 48-16 66-2"/>
    <path opacity=".18" stroke-width="9" d="M445 93c4 18 23 34 41 37"/>
    <path opacity=".15" stroke-width="3" d="M-23 294c32-15 60-1 70 25 6 18 5 30-1 43m-6 9c-9 9-22 15-35 15"/>
  </g>
  <g fill="#8e5728" opacity=".34" filter="url(#bleed)">
    <path d="M411 106c-6-3-8 7-4 9 6 3 11-6 4-9zm-11 17c-3-2-5 2-3 4 2 1 5-1 3-4zm66 36c-6-4-10 2-7 6 4 4 12-1 7-6z"/>
    <path d="M30 277c-3-3-8 1-5 4 3 3 6 0 5-4zm-9-8c-2 0-3 3 0 3 2 0 2-2 0-3z"/>
  </g>
  <path d="m0 181 82 5 94 1 159 8 177 4" stroke="#7c684c" opacity=".11" fill="none"/>
  <path d="m0 183 83 5 93 1 159 8 177 4" stroke="#fffbea" opacity=".35" fill="none"/>
</svg>
